<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Счётчик отсутствия</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --panel: #11111a;
      --border: #1e1e2e;
      --accent: #ff3c5f;
      --accent2: #ff8c42;
      --text: #e8e8f0;
      --muted: #4a4a6a;
      --green: #3cffa0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Фоновая сетка */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,60,95,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,60,95,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* Свечение по центру */
    body::after {
      content: '';
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 600px; height: 600px;
      background: radial-gradient(ellipse, rgba(255,60,95,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 20px;
    }

    /* Заголовок */
    .title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 8vw, 6rem);
      letter-spacing: 0.15em;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 60px;
    }

    /* Основная карточка */
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 40px 60px;
      position: relative;
      min-width: 380px;
      box-shadow: 0 0 60px rgba(255,60,95,0.05), inset 0 1px 0 rgba(255,255,255,0.03);
    }

    /* Угловые декоры */
    .card::before, .card::after {
      content: '';
      position: absolute;
      width: 12px; height: 12px;
      border-color: var(--accent);
      border-style: solid;
    }
    .card::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
    .card::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

    /* Статус-индикатор */
    .status-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      transition: background 0.4s, box-shadow 0.4s;
    }
    .dot.away {
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 1s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.7; }
    }

    .status-text {
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
      transition: color 0.4s;
    }
    .status-text.away { color: var(--accent); }

    /* Большой таймер */
    .timer-label {
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .timer-display {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(4rem, 15vw, 8rem);
      letter-spacing: 0.05em;
      line-height: 1;
      color: var(--text);
      transition: color 0.4s;
      margin-bottom: 8px;
    }
    .timer-display.away { color: var(--accent); }
    .timer-display.away { text-shadow: 0 0 40px rgba(255,60,95,0.4); }

    .timer-sub {
      font-size: 0.55rem;
      color: var(--muted);
      letter-spacing: 0.2em;
    }

    /* Разделитель */
    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin: 30px 0;
    }

    /* Статистика */
    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
    }

    .stat {
      text-align: center;
    }

    .stat-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      letter-spacing: 0.05em;
      color: var(--accent2);
      line-height: 1;
    }

    .stat-label {
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      color: var(--muted);
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* Лог событий */
    .log-section {
      margin-top: 40px;
      width: 100%;
      max-width: 500px;
    }

    .log-header {
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      color: var(--muted);
      text-transform: uppercase;
      text-align: left;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .log-header::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .log-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 160px;
      overflow-y: auto;
    }

    .log-list::-webkit-scrollbar { width: 2px; }
    .log-list::-webkit-scrollbar-track { background: transparent; }
    .log-list::-webkit-scrollbar-thumb { background: var(--border); }

    .log-item {
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      background: rgba(255,255,255,0.01);
      border-left: 2px solid var(--border);
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-8px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .log-item.leave { border-left-color: var(--accent); }
    .log-item.return { border-left-color: var(--green); }

    .log-time { color: var(--muted); min-width: 55px; }
    .log-event { flex: 1; }
    .log-duration { color: var(--accent2); }

    /* Защита от копирования */
    * {
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      user-select: none !important;
    }

    /* Счётчик посетителей */
    .visitors-section {
      margin-top: 24px;
      text-align: center;
    }
    .visitors-label {
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .visitors-count {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.5rem;
      letter-spacing: 0.1em;
      color: var(--green);
      text-shadow: 0 0 20px rgba(60,255,160,0.3);
    }

    /* Кнопка сброса */
    .reset-btn {
      margin-top: 30px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 10px 24px;
      cursor: pointer;
      transition: all 0.2s;
      border-radius: 2px;
    }

    .reset-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(255,60,95,0.05);
    }

    /* Оверлей "ушёл" */
    .away-overlay {
      position: fixed;
      inset: 0;
      background: rgba(255,60,95,0.03);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s;
      z-index: 5;
    }
    .away-overlay.active { opacity: 1; }

    /* Заголовок вкладки - индикатор */
    .tab-notice {
      position: fixed;
      top: 16px;
      right: 16px;
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      color: var(--muted);
      text-transform: uppercase;
      z-index: 20;
    }
  </style>
</head>
<body>

  <div class="away-overlay" id="awayOverlay"></div>
  <div class="tab-notice">// VISIBILITY TRACKER v1.0</div>

  <div class="container">
    <div class="title">AWAY TIME</div>
    <div class="subtitle">// мониторинг присутствия пользователя</div>

    <div class="card">
      <div class="status-row">
        <div class="dot" id="statusDot"></div>
        <div class="status-text" id="statusText">НА САЙТЕ</div>
      </div>

      <div class="timer-label">// время отсутствия</div>
      <div class="timer-display" id="timerDisplay">00:00</div>
      <div class="timer-sub">ЧЧ:ММ:СС</div>

      <div class="divider"></div>

      <div class="stats-row">
        <div class="stat">
          <div class="stat-value" id="countStat">0</div>
          <div class="stat-label">уходов</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="totalStat">00:00</div>
          <div class="stat-label">всего</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="maxStat">00:00</div>
          <div class="stat-label">макс раз</div>
        </div>
      </div>
    </div>

    <div class="log-section">
      <div class="log-header">// журнал событий</div>
      <ul class="log-list" id="logList">
        <li class="log-item">
          <span class="log-time" id="startTime">--:--:--</span>
          <span class="log-event">сессия начата</span>
        </li>
      </ul>
    </div>

    <button class="reset-btn" onclick="resetAll()">↺ сбросить статистику</button>

    <div class="visitors-section">
      <div class="visitors-label">// всего посетителей сайта</div>
      <div class="visitors-count" id="visitorsCount">—</div>
    </div>
  </div>

  <script>
    // === Состояние ===
    let isAway = false;
    let awayStart = null;
    let currentTick = 0;
    let tickInterval = null;

    let totalAwayMs = 0;
    let maxAwayMs = 0;
    let awayCount = 0;

    // Элементы
    const dot        = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const timerEl    = document.getElementById('timerDisplay');
    const overlay    = document.getElementById('awayOverlay');
    const countEl   = document.getElementById('countStat');
    const totalEl   = document.getElementById('totalStat');
    const maxEl     = document.getElementById('maxStat');
    const logList   = document.getElementById('logList');

    // Время начала сессии
    document.getElementById('startTime').textContent = nowStr();

    function nowStr() {
      return new Date().toLocaleTimeString('ru-RU');
    }

    function msToDisplay(ms) {
      const s = Math.floor(ms / 1000);
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      if (h > 0) return `${pad(h)}:${pad(m)}:${pad(sec)}`;
      return `${pad(m)}:${pad(sec)}`;
    }

    function pad(n) { return String(n).padStart(2, '0'); }

    function addLog(type, text, extra) {
      const li = document.createElement('li');
      li.className = `log-item ${type}`;
      li.innerHTML = `<span class="log-time">${nowStr()}</span>
                      <span class="log-event">${text}</span>
                      ${extra ? `<span class="log-duration">${extra}</span>` : ''}`;
      logList.prepend(li);
      // Оставляем только 20 последних
      while (logList.children.length > 20) logList.removeChild(logList.lastChild);
    }

    function startAway() {
      if (isAway) return;
      isAway = true;
      awayStart = Date.now();
      currentTick = 0;

      dot.classList.add('away');
      statusText.textContent = 'ПОКИНУЛ САЙТ';
      statusText.classList.add('away');
      timerEl.classList.add('away');
      overlay.classList.add('active');

      // Обновляем заголовок вкладки
      const origTitle = document.title;
      document.title = '⚠️ Пользователь ушёл...';

      tickInterval = setInterval(() => {
        currentTick = Date.now() - awayStart;
        timerEl.textContent = msToDisplay(currentTick);
        document.title = `⚠️ ${msToDisplay(currentTick)} — ушёл`;
      }, 500);

      addLog('leave', 'пользователь ушёл');
    }

    function endAway() {
      if (!isAway) return;
      isAway = false;

      clearInterval(tickInterval);
      const duration = Date.now() - awayStart;

      totalAwayMs += duration;
      awayCount++;
      if (duration > maxAwayMs) maxAwayMs = duration;

      // Обновляем статистику
      countEl.textContent = awayCount;
      totalEl.textContent = msToDisplay(totalAwayMs);
      maxEl.textContent   = msToDisplay(maxAwayMs);

      dot.classList.remove('away');
      statusText.textContent = 'НА САЙТЕ';
      statusText.classList.remove('away');
      timerEl.classList.remove('away');
      timerEl.textContent = msToDisplay(duration);
      overlay.classList.remove('active');
      document.title = 'Счётчик отсутствия';

      addLog('return', 'вернулся на сайт', msToDisplay(duration));

      // Через 2 сек сбросить отображение таймера на 00:00
      setTimeout(() => {
        if (!isAway) timerEl.textContent = '00:00';
      }, 3000);
    }

    function resetAll() {
      totalAwayMs = 0;
      maxAwayMs = 0;
      awayCount = 0;
      countEl.textContent = '0';
      totalEl.textContent = '00:00';
      maxEl.textContent   = '00:00';
      timerEl.textContent = '00:00';
      logList.innerHTML = `<li class="log-item">
        <span class="log-time">${nowStr()}</span>
        <span class="log-event">статистика сброшена</span>
      </li>`;
    }

    // === Счётчик посетителей (counterapi.dev) ===
    async function loadVisitors() {
      const el = document.getElementById('visitorsCount');
      try {
        const res = await fetch('https://api.counterapi.dev/v1/vasya-counter/moy-sayt/up');
        const data = await res.json();
        el.textContent = data.count.toLocaleString('ru-RU');
      } catch(e) {
        el.textContent = '—';
      }
    }
    loadVisitors();

    // === Защита от копирования ===
    ['copy', 'cut', 'contextmenu', 'selectstart', 'dragstart'].forEach(e => {
      document.addEventListener(e, ev => ev.preventDefault());
    });

    // === Page Visibility API ===
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        startAway();
      } else {
        endAway();
      }
    });

    // === Дополнительно: потеря фокуса окна ===
    window.addEventListener('blur', startAway);
    window.addEventListener('focus', endAway);
  </script>
</body>
</html>
